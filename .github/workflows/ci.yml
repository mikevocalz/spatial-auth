name: Spatial Auth CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  js-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install --ignore-scripts
      - name: Build packages
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
